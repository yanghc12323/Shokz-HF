[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-align"
version = "0.1.0"
description = "Rigid landmark-based alignment and OBJ/STL export for 3D ear meshes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "trimesh>=4.0",
]

[project.scripts]
ear-align = "ear_align.cli:main"
ear-align-gui = "ear_align.gui:main"

[tool.setuptools.packages.find]
include = ["ear_align*"]
